[metadata]
name = orcaopta
version = 0.1.0
description = Multi-cloud operator brain for SRE automation, observability, and intelligent remediation.
author = Samuel Orcas
author_email = orcaprojectstack@gmail.com
license = MIT
long_description = file: README.md
long_description_content_type = text/markdown

keywords =
    sre
    cloud-operator
    observability
    automation
    openstack
    kubernetes
    ceph
    minio
    spark
    terraform

classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: POSIX :: Linux
    Topic :: System :: Monitoring
    Topic :: System :: Distributed Computing

[options]
python_requires = >=3.10
package_dir =
    = src
packages = find:

install_requires =
    # Core utilities
    pyyaml
    rich
    python-dotenv
    typer
    orjson
    click

    # Cloud backends
    minio
    cryptography
    ossaudit

    # Optional ML (small footprint)
   ##faiss-cpu

include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    orcaopta = orcaopta.cli.orcaopta_cli:app
