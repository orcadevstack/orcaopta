[metadata]
name = orcaopta
version = 0.1.0
description = Cloud-native SRE automation framework with ML, MCP, observability, operator tooling, and intelligent remediation.
author = Samuel Orcas
author_email = orcaprojectstack@gmail.com
license = MIT
license_files = LICENSE
long_description = file: README.md
long_description_content_type = text/markdown

[options]
python_requires = >=3.13.5
package_dir =
    = src
packages = find:

include_package_data = True

install_requires =
    # ORCAOPTA CORE
    fastapi
    uvicorn[standard]
    python-multipart
    pydantic
    requests
    SQLAlchemy
    cryptography
    ossaudit
    rich
    python-dotenv
    typer
    orjson
    pyyaml
    click

    # OBSERVABILITY
    opentelemetry-api
    opentelemetry-sdk
    opentelemetry-exporter-otlp-proto-http

    # DATA + ML / MCP
    pandas
    numpy
    torch
    transformers
    scikit-learn
    joblib

    # SPARK SUBSYSTEM
    pyspark

    # CLOUD SCANNERS
    boto3
    google-auth
    google-cloud-storage
    google-cloud-compute
    azure-identity
    azure-mgmt-storage
    azure-mgmt-network
    openstacksdk

    # SAAS SCANNERS
    requests

    # CVE / VULNERABILITY PIPELINE
    cve-bin-tool
    nvdlib
    vulners

    # SBOM PROCESSING
    cyclonedx-python-lib
    spdx-tools

    # ATTACK PATH GRAPHING
    networkx
    graphviz
    pygraphviz

    # YAML / JSON SECURITY
    jsonschema
    ruamel.yaml

    # CONTAINER / K8S
    docker
    kubernetes

    # Threat Intel / Blockchain
    attackcti
    stix2
    taxii2-client
    web3

[options.packages.find]
where = src

[options.extras_require]
dashboard =
    matplotlib>=3.11
    seaborn
    plotly
    pyvis
    networkx
    streamlit

cloud =
    openstacksdk
    kubernetes
    python-hcl2

spark =
    pyspark
    py4j
    kafka-python

explain =
    shap

mlflow-legacy =
    mlflow
    protobuf
    sqlalchemy
    alembic

notebooks =
    jupyter
    notebook
    jupyterlab
    ipython
    ipykernel
    pyzmq
    pandas
    numpy
    matplotlib
    seaborn
    plotly
    networkx
    pyvis
    scikit-learn
    joblib

dev =
    pytest
    black
    flake8
    mypy
    pre-commit

[flake8]
max-line-length = 120
exclude = .git,__pycache__,build,dist

[mypy]
python_version = 3.13
ignore_missing_imports = True
strict_optional = False

[tool:pytest]
testpaths = tests

[coverage:run]
branch = True
source = src/orcaopta

[coverage:report]
show_missing = True
skip_covered = True

[isort]
profile = black
