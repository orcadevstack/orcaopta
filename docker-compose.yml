
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orcaopta-app
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
      - minio
      - mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123
      MLFLOW_TRACKING_URI: http://mlflow:5000

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orcaopta-jupyter
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root notebooks
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
      - minio
      - mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123
      MLFLOW_TRACKING_URI: http://mlflow:5000

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: orcaopta-mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflowpass@postgres:5432/mlflowdb
      --default-artifact-root s3://orcaopta-artifacts
      --host 0.0.0.0
    depends_on:
      - postgres
      - minio
    volumes:
      - ./mlflow:/mlflow

  postgres:
    image: postgres:15
    container_name: orcaopta-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflowpass
      POSTGRES_DB: mlflowdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: orcaopta-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: orcaopta-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mlflow:
