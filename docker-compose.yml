services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: orcaopta-app
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
      - minio
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_ALLOWED_HOSTS: "*"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://mlflow:5000/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: x-mlflow-experiment-id=0
      FERNET_KEYS: "qthk-LEH_AwQeemUe4b9zV8bizUZIj9vusKQ_33NMPg=,wL0p3jWxP8HApMM79VNMHR8z9xslAG-LPGqpKvtnvJk="
    restart: unless-stopped

  train:
    build:
      context: .
      dockerfile: Dockerfile
      target: trainer
    container_name: orcaopta-train
    command: python scripts/train_models.py
    depends_on:
      - mlflow
      - minio
      - postgres
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://mlflow:5000/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: x-mlflow-experiment-id=0

  jupyter:
    build:
      context: .
      dockerfile: notebooks/Dockerfile
    container_name: orcaopta-jupyter
    command: >
      jupyter-lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --notebook-dir=/app/notebooks
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
      - minio
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://mlflow:5000/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: x-mlflow-experiment-id=0
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: orcaopta-mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_ALLOWED_HOSTS: "*"
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflowpass@postgres:5432/mlflowdb
      --default-artifact-root s3://orcaopta-artifacts
      --host 0.0.0.0
    depends_on:
      - postgres
      - minio
    volumes:
      - ./mlflow:/mlflow
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: orcaopta-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflowpass
      POSTGRES_DB: mlflowdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: orcaopta-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: orcaopta-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  mlflow:
