
services:
  orcaopta:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    container_name: orcaopta-hybrid
    ports:
      - "8000:8000"
    environment:
      ORCAOPTA_MODE: hybrid

  
      OS_AUTH_URL: "https://your-openstack:5000/v3"
      OS_USERNAME: "admin"
      OS_PASSWORD: "secret"
      OS_PROJECT_NAME: "admin"
      OS_USER_DOMAIN_NAME: "Default"
      OS_PROJECT_DOMAIN_NAME: "Default"

      KUBECONFIG: /app/kubeconfig

    
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db

    volumes:
      - ./mlruns:/app/mlruns
      - ./kubeconfig:/app/kubeconfig:ro
      - ./logs:/app/logs

    command: >
      uvicorn src.api.main:app
      --host 0.0.0.0
      --port 8000
