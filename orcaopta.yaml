orcaopta:
  name: "Orcaopta Cloud AI"
  version: "0.1.0"
  environment: "Dev"
  mode: "cluster"

api:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

database:
  url: "sqlite:///orcaopta.db"

models:
  directory: "/app/models"
  core_model: "orcaopta_core_model.pkl"

  anomaly:
    default: "anomaly_model.pkl"
    versions:
      - "anomaly_v1.pkl"
      - "anomaly_v2.pkl"
      - "anomaly_v3.pkl"

  forecast:
    default: "forecast_model.pkl"
    versions:
      - "forecast_v1.pkl"
      - "forecast_v2.pkl"
      - "forecast_v3.pkl"

  resource_opt:
    default: "resource_opt_model.pkl"
    versions:
      - "resource_opt_v1.pkl"
      - "resource_opt_v2.pkl"
      - "resource_opt_v3.pkl"

  autoscale:
    default: "autoscale_model.pkl"
    versions:
      - "autoscale_v1.pkl"
      - "autoscale_v2.pkl"
      - "autoscale_v3.pkl"

data:
  directory: "/app/data/processed"

cloud_storage:
  enabled: false
  endpoint: "minio:9000"
  bucket: "orcaopta-data"
  access_key: "encrypted-access-key"
  secret_key: "encrypted-secret-key"

queue:
  backend: "local"
  redis_url: "redis://redis:6379/0"

ai:
  llm:
    provider: "ollama"
    model: "qwen2.5"
    endpoint: "http://localhost:11434/api/generate"

autoscaling:
  enabled: true
  min_replicas: 1
  max_replicas: 20
  cooldown_seconds: 60

  policy:
    gpu_utilization_scale_up_threshold: 70
    gpu_utilization_scale_down_threshold: 30
    ml_autoscale_scale_up_threshold: 0.2
    ml_autoscale_scale_down_threshold: -0.2
    hysteresis_margin: 0.05

ml:
  autoscale: "disabled"

security:
  encryption_key: "change-this-key"
  allow_public_api: false

logging:
  level: "info"
  file: "/app/logs/orcaopta.log"

terraform:
  enabled: false
  working_dir: "./terraform"

openstack:
  enabled: false
  group_name: "orcaopta-cluster"

k8s:
  enabled: false
  namespace: "default"
  deployment: "orcaopta-api"

spark:
  enabled: false

telemetry:
  enabled: false

attack:
  enabled: false
