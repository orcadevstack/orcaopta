# ============================================================
# Orcaopta Global Configuration
# ============================================================

orcaopta:
  name: "Orcaopta Cloud AI"
  version: "1.0.0"
  environment: "production"
  mode: "cluster"

# ============================================================
# API
# ============================================================

api:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

# ============================================================
# Database
# ============================================================

database:
  url: "sqlite:///orcaopta.db"
  # For production:
  # url: "postgresql://orcaopta:pass@db/orcaopta"

# ============================================================
# Models
# ============================================================

models:
  directory: "/app/models"
  core_model: "orcaopta_core_model.pkl"

  anomaly:
    default: "anomaly_model.pkl"
    versions:
      - "anomaly_v1.pkl"
      - "anomaly_v2.pkl"
      - "anomaly_v3.pkl"

  forecast:
    default: "forecast_model.pkl"
    versions:
      - "forecast_v1.pkl"
      - "forecast_v2.pkl"
      - "forecast_v3.pkl"

  resource_opt:
    default: "resource_opt_model.pkl"
    versions:
      - "resource_opt_v1.pkl"
      - "resource_opt_v2.pkl"
      - "resource_opt_v3.pkl"

  autoscale:
    default: "autoscale_model.pkl"
    versions:
      - "autoscale_v1.pkl"
      - "autoscale_v2.pkl"
      - "autoscale_v3.pkl"

# ============================================================
# Data
# ============================================================

data:
  directory: "/app/data/processed"

# ============================================================
# Cloud Storage (MinIO / S3)
# ============================================================

cloud_storage:
  enabled: false
  endpoint: "minio:9000"
  bucket: "orcaopta-data"
  access_key: "encrypted-access-key"
  secret_key: "encrypted-secret-key"

# ============================================================
# Queue Backend
# ============================================================

queue:
  backend: "local"
  redis_url: "redis://redis:6379/0"

# ============================================================
# AI Engine (LLM)
# ============================================================

ai:
  llm:
    provider: "ollama"
    model: "qwen2.5"
    endpoint: "http://localhost:11434/api/generate"

# ============================================================
# Autoscaling (GLOBAL)
# ============================================================

autoscaling:
  enabled: true
  min_replicas: 1
  max_replicas: 20
  cooldown_seconds: 60

  policy:
    gpu_utilization_scale_up_threshold: 70     # %
    gpu_utilization_scale_down_threshold: 30   # %
    ml_autoscale_scale_up_threshold: 0.2       # mean > 0.2 → scale up
    ml_autoscale_scale_down_threshold: -0.2    # mean < -0.2 → scale down
    hysteresis_margin: 0.05                    # avoid flapping

# ============================================================
# ML Configuration
# ============================================================

ml:
  autoscale: "disabled"   # or "scale_up" / "scale_down"

# ============================================================
# Security
# ============================================================

security:
  encryption_key: "change-this-key"
  allow_public_api: false

# ============================================================
# Logging
# ============================================================

logging:
  level: "info"
  file: "/app/logs/orcaopta.log"

# ============================================================
# Terraform
# ============================================================

terraform:
  enabled: false
  working_dir: "./terraform"

# ============================================================
# OpenStack Integration
# ============================================================

openstack:
  enabled: false
  group_name: "orcaopta-cluster"   # used by autoscaler

# ============================================================
# Kubernetes Integration
# ============================================================

k8s:
  enabled: false
  namespace: "default"
  deployment: "orcaopta-api"

# ============================================================
# Spark
# ============================================================

spark:
  enabled: false

# ============================================================
# Telemetry / Tracing
# ============================================================

telemetry:
  enabled: false

# ============================================================
# MITRE ATT&CK
# ============================================================

attack:
  enabled: false
