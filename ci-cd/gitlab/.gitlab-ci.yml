stages:
  - test
  - build
  - train
  - deploy

variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE/orcaopta-api"

test:
  stage: test
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - pytest

build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - docker build -t "$DOCKER_IMAGE:latest" -f docker/Dockerfile .
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push "$DOCKER_IMAGE:latest"

train:
  stage: train
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - python src/ml/anomaly_detection.py
    - python src/ml/forecasting.py
    - python src/ml/resource_optimization.py
    - python src/ml/autoscaling.py
  artifacts:
    paths:
      - models/

deploy:
  stage: deploy
  image: hashicorp/terraform:1.9
  script:
    - cd terraform/kube
    - terraform init
    - terraform apply -auto-approve \
        -var="api_image=$DOCKER_IMAGE:latest" \
        -var="kube_host=$KUBE_HOST" \
        -var="client_cert=$KUBE_CLIENT_CERT" \
        -var="client_key=$KUBE_CLIENT_KEY" \
        -var="cluster_ca=$KUBE_CA"
