name: Orcaopta CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        run: |
          docker build \
            --target api \
            -t ghcr.io/${{ github.repository_owner }}/orcaopta-api:latest .

      - name: Build trainer image
        run: |
          docker build \
            --target trainer \
            -t ghcr.io/${{ github.repository_owner }}/orcaopta-train:latest .

      - name: Push images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/orcaopta-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/orcaopta-train:latest
