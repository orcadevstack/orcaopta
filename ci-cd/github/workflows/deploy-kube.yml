name: Deploy to Kubernetes

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t orcaopta-api -f docker/Dockerfile .

      - name: Push Docker image (example: Docker Hub)
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag orcaopta-api "${{ secrets.DOCKER_USERNAME }}/orcaopta-api:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/orcaopta-api:latest"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/kube
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/kube
        run: terraform apply -auto-approve \
          -var="api_image=${{ secrets.DOCKER_USERNAME }}/orcaopta-api:latest" \
          -var="kube_host=${{ secrets.KUBE_HOST }}" \
          -var="client_cert=${{ secrets.KUBE_CLIENT_CERT_PATH }}" \
          -var="client_key=${{ secrets.KUBE_CLIENT_KEY_PATH }}" \
          -var="cluster_ca=${{ secrets.KUBE_CA_PATH }}"
