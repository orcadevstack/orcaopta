name: Orcaopta Full CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  full-pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mlflow
          POSTGRES_PASSWORD: mlflowpass
          POSTGRES_DB: mlflowdb
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: admin
          MINIO_ROOT_PASSWORD: admin123
        ports:
          - 9000:9000
        command: server /data

      mlflow:
        image: ghcr.io/mlflow/mlflow:latest
        ports:
          - 5000:5000
        env:
          MLFLOW_S3_ENDPOINT_URL: http://minio:9000
          AWS_ACCESS_KEY_ID: admin
          AWS_SECRET_ACCESS_KEY: admin123
        command: >
          mlflow server
          --backend-store-uri postgresql://mlflow:mlflowpass@postgres:5432/mlflowdb
          --default-artifact-root s3://orcaopta-artifacts
          --host 0.0.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code
        run: |
          pip install flake8
          flake8 src

      - name: Run unit tests
        run: |
          pytest -q

      - name: Run ML training (src/ml)
        env:
          MLFLOW_S3_ENDPOINT_URL: http://localhost:9000
          AWS_ACCESS_KEY_ID: admin
          AWS_SECRET_ACCESS_KEY: admin123
        run: |
          python src/ml/train.py

      - name: Run RL training (src/rl)
        env:
          MLFLOW_S3_ENDPOINT_URL: http://localhost:9000
          AWS_ACCESS_KEY_ID: admin
          AWS_SECRET_ACCESS_KEY: admin123
        run: |
          python src/rl/train_rl.py

      - name: Run API tests (src/api)
        run: |
          python src/api/app.py --test-mode

      - name: Build Docker image
        run: |
          docker build -t orcaopta:latest .

      - name: Push Docker image (optional)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag orcaopta:latest ${{ secrets.DOCKER_USERNAME }}/orcaopta:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/orcaopta:latest
