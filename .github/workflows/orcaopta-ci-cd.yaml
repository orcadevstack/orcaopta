name: Orcaopta CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: ./.github/actions/checkout

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code
        run: |
          pip install flake8
          flake8 src

      - name: Run unit tests
        run: pytest -q

      - name: API health check
        run: |
          uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/docs

      - name: Build Docker image
        run: docker build -t orcaopta:latest .

      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag orcaopta:latest ${{ secrets.DOCKER_USERNAME }}/orcaopta:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/orcaopta:latest


  build-cli:
    needs: build-core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: ./.github/actions/checkout

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          pip install pyinstaller
          sudo apt-get update
          sudo apt-get install -y dpkg-dev pkg-config fakeroot zip

      - name: Build CLI
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload CLI artifacts
        uses: ./.github/actions/upload-artifact
        with:
          name: orcaopta-cli
          path: dist/


  deploy:
    needs: build-cli
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: ./.github/actions/checkout

      - name: Set up kubectl
        uses: ./.github/actions/setup-kubectl

      - name: Set up Helm
        uses: ./.github/actions/setup-helm

      - name: Load KUBECONFIG
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Deploy Orcaopta via Helm
        run: |
          helm upgrade --install orcaopta charts/orcaopta \
            --namespace orcaopta \
            --create-namespace \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/orcaopta \
            --set image.tag=latest

      - name: Wait for rollout
        run: kubectl rollout status deployment/orcaopta-app -n orcaopta

      - name: Post-deploy health check
        run: |
          kubectl get pods -n orcaopta
          kubectl get svc -n orcaopta
          curl -f http://orcaopta-app.orcaopta.svc.cluster.local:8000/docs


  ai-rollback:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: ./.github/actions/checkout

      - name: Set up kubectl
        uses: ./.github/actions/setup-kubectl

      - name: Load KUBECONFIG
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Collect cluster signals
        run: |
          kubectl get pods -n orcaopta -o wide > pods.txt
          kubectl get events -n orcaopta --sort-by=.metadata.creationTimestamp > events.txt

      - name: AI rollback decision
        run: |
          python - << 'EOF'
          import subprocess
          from src.orcaopta.ai.agent import ai_self_heal_plan

          pods = open("pods.txt").read()
          events = open("events.txt").read()

          plan = ai_self_heal_plan([{"pods": pods, "events": events}])

          print("=== AI ROLLBACK PLAN ===")
          print(plan)
          print("=== END AI ROLLBACK PLAN ===")

          if "rollback" in plan.lower():
              print("AI suggests rollback. Executing rollback...")
              subprocess.run(
                  ["kubectl", "rollout", "undo", "deployment/orcaopta-app", "-n", "orcaopta"],
                  check=False
              )
          else:
              print("AI does NOT suggest rollback.")
          EOF
