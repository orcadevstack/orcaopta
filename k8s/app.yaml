apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcaopta-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orcaopta-app
  template:
    metadata:
      labels:
        app: orcaopta-app
    spec:
      containers:
        - name: orcaopta-app
          image: orcaopta:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio:9000"
---
apiVersion: v1
kind: Service
metadata:
  name: orcaopta-app
spec:
  selector:
    app: orcaopta-app
  ports:
    - port: 8000
      targetPort: 8000
  type: NodePort
