apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcaopta-app
  namespace: orcaopta
  labels:
    app: orcaopta-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orcaopta-app
  template:
    metadata:
      labels:
        app: orcaopta-app
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: orcaopta-app
          image: orcastack/orcaopta-app:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.orcaopta.svc.cluster.local:5000"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio.orcaopta.svc.cluster.local:9000"
            - name: AWS_ACCESS_KEY_ID
              value: "admin"
            - name: AWS_SECRET_ACCESS_KEY
              value: "admin123"
            - name: FERNET_KEYS
              valueFrom:
                secretKeyRef:
                  name: orcaopta-fernet
                  key: FERNET_KEYS
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: orcaopta-app
  namespace: orcaopta
spec:
  selector:
    app: orcaopta-app
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
  type: NodePort
