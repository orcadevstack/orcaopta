apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orcaopta-role
  namespace: orcaopta
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orcaopta-rb
  namespace: orcaopta
subjects:
  - kind: ServiceAccount
    name: orcaopta-sa
roleRef:
  kind: Role
  name: orcaopta-role
  apiGroup: rbac.authorization.k8s.io
