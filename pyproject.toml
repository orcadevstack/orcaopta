[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orcaopta"
version = "0.1.0"
description = "Cloud-native SRE automation framework with MCP, observability, operator tooling, and intelligent remediation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13.5"

authors = [
    { name = "Samuel Orcas", email = "orcaprojectstack@gmail.com" }
]

keywords = [
    "sre", "mcp", "observability", "cloud", "automation",
    "openstack", "kubernetes", "telemetry", "autoscaling"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Framework :: FastAPI",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Distributed Computing"
]

dependencies = [
    ##############################
    # ORCAOPTA CORE
    ##############################
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "requests",
    "SQLAlchemy",
    "cryptography",
    "ossaudit",
    "rich",
    "python-dotenv",
    "typer",
    "orjson",
    "pyyaml",
    "click",

    ##############################
    # OBSERVABILITY
    ##############################
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",

    ##############################
    # DATA + ML / MCP
    ##############################
    "pandas",
    "numpy",
    "torch",
    "transformers",
    "scikit-learn",
    "joblib",

    ##############################
    # SPARK SUBSYSTEM
    ##############################
    "pyspark",

    ##############################
    # CLOUD SCANNERS
    ##############################
    "boto3",
    "google-auth",
    "google-cloud-storage",
    "google-cloud-compute",
    "azure-identity",
    "azure-mgmt-storage",
    "azure-mgmt-network",
    "openstacksdk",

    ##############################
    # SAAS SCANNERS
    ##############################
    "requests",

    ##############################
    # CVE / VULNERABILITY PIPELINE
    ##############################
    "cve-bin-tool",
    "nvdlib",
    "vulners",

    ##############################
    # SBOM PROCESSING
    ##############################
    "cyclonedx-python-lib",
    "spdx-tools",

    ##############################
    # ATTACK PATH GRAPHING
    ##############################
    "networkx",
    "graphviz",
    "pygraphviz",

    ##############################
    # YAML / JSON SECURITY
    ##############################
    "jsonschema",
    "ruamel.yaml",

    ##############################
    # CONTAINER / K8S
    ##############################
    "docker",
    "kubernetes",
    shap
    
    ##############################
    # Threat Intel / Blockchain
    ##############################
    "attackcti",
    "stix2",
    "taxii2-client",
    "web3"
]


[project.optional-dependencies]
cloud = ["openstacksdk", "kubernetes", "python-hcl2"]
dashboard = ["matplotlib>=3.11", "seaborn", "plotly", "pyvis", "networkx", "streamlit"]
explain = ["shap"]
dev = ["pytest", "black", "flake8", "mypy", "pre-commit"]

[project.scripts]
orcaopta = "orcaopta.cli.orcaopta_cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
