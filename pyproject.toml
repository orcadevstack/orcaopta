[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orcaopta"
version = "0.1.0"
description = "Cloud-native SRE automation framework with ML, RL, observability, and intelligent remediation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13.5"

authors = [
    { name = "Samuel Orcas", email = "orcaprojectstack@gmail.com" }
]

keywords = [
    "sre", "ml", "rl", "observability", "cloud", "automation",
    "openstack", "kubernetes", "telemetry", "autoscaling"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Framework :: FastAPI",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "requests",
    "pandas",
    "numpy",
    "scikit-learn",
    "joblib",
    "stable-baselines3",
    "gymnasium",
    "SQLAlchemy",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "cryptography",
    "ossaudit",
    "hoppr-cop",
    "rich",
    "python-dotenv",
    "typer",
    "orjson",
    "pyyaml"
]

[project.optional-dependencies]
dashboard = ["matplotlib>=3.11", "seaborn", "plotly", "pyvis", "networkx", "streamlit"]
cloud = ["openstacksdk", "kubernetes", "python-hcl2"]
spark = ["pyspark", "py4j", "kafka-python"]
explain = ["shap"]
mlflow-legacy = ["mlflow", "protobuf", "sqlalchemy", "alembic"]
notebooks = [
    "jupyter", "notebook", "jupyterlab", "ipython", "ipykernel",
    "pyzmq", "pandas", "numpy", "matplotlib", "seaborn",
    "plotly", "networkx", "pyvis", "scikit-learn", "joblib"
]
dev = ["pytest", "black", "flake8", "mypy", "pre-commit"]

[project.scripts]
orcaopta = "orcaopta.cli.orcaopta_cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
