[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orcaopta"
version = "0.1.0"
description = "Multi-cloud operator brain for SRE automation, observability, and intelligent remediation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

authors = [
    { name = "Samuel Orcas", email = "orcaprojectstack@gmail.com" }
]

keywords = [
    "sre", "cloud-operator", "observability", "automation",
    "openstack", "kubernetes", "ceph", "minio", "spark", "terraform"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Distributed Computing"
]

dependencies = [
    # Core utilities
    "pyyaml",
    "rich",
    "python-dotenv",
    "typer",
    "orjson",
    "click",

    # Cloud backends
    "minio",
    "cryptography",
    "ossaudit",

    # Optional ML (small footprint)
    #"sentence-transformers",
    #"faiss-cpu"
]

[project.scripts]
orcaopta = "orcaopta.cli.orcaopta_cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
